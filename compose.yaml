services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secclaw
      POSTGRES_USER: secclaw
      POSTGRES_PASSWORD: secclaw_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - secclaw_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secclaw -d secclaw"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://secclaw:secclaw_dev@postgres:5432/secclaw
      SESSION_SECRET: secclaw-local-development-secret-change-me
      USER_CSV_PATH: /data/users.csv
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      VLLM_HOST: ${VLLM_HOST:-http://host.docker.internal:8000}
      VLLM_MODEL: ${VLLM_MODEL:-gpt-oss-120b}
      SECCLAW_DISCORD_WEBHOOK: ${SECCLAW_DISCORD_WEBHOOK:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./web:/app
      - ./data:/data:ro
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "npm install --no-audit --no-fund && npm run db:push && npm run db:import-users && npm run dev -- --hostname 0.0.0.0"

  scanner:
    build:
      context: ./web
      dockerfile: Dockerfile
    network_mode: host
    cap_add:
      - NET_RAW
    environment:
      DATABASE_URL: postgresql://secclaw:secclaw_dev@127.0.0.1:5432/secclaw
      SCAN_SCRIPT: /scripts/vllm_scan.sh
      SCAN_TARGETS: 192.168.32.0/20
      SCAN_INTERFACE: wlP9s9
      SCAN_PORTS: "8000"
      SCAN_ARP_INTERVAL: "100"
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      - web
    command: node scripts/scan-worker.mjs

volumes:
  secclaw_postgres_data:
  web_node_modules:
  web_next_cache:
